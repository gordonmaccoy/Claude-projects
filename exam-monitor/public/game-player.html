<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examio · Games</title><link rel="stylesheet" href="/examio.css"><link rel="stylesheet" href="/game.css"><link rel="stylesheet" href="/game-stage.css"><link rel="stylesheet" href="/game-picker.css"></head><body class="game-player"><header><a class="brand" href="/game-library.html"><img src="/landing/examio-mark.svg" alt="" width="40" height="40"><strong>Examio</strong><span>PLAY · LEARN · REPEAT</span></a><a href="/professor.html" class="back-link">Testing workspace</a></header><main><p id="status" role="status" aria-live="polite"></p><p id="signin" hidden><a href="/professor.html">Sign in to Examio</a>, then return to Games.</p><section id="join-form-section" class="join-card"><p class="eyebrow">YOUR NEXT CHALLENGE</p><h1>Join the game</h1><form id="join-form"><label id="join-pin-label">Game PIN<input id="join-pin" required inputmode="numeric" maxlength="12" autocomplete="off"></label><label id="nickname-label" hidden>Nickname<input id="nickname" maxlength="30" autocomplete="nickname"></label><fieldset class="avatar-field" id="avatar-field" hidden><legend>Choose your character</legend><div id="avatar-picker" class="avatar-picker"></div><nav id="avatar-pages" aria-label="Character pages" hidden><button type="button" id="avatar-prev" aria-label="Previous character page">‹</button><span id="avatar-page-label" aria-live="polite">1 / 2</span><button type="button" id="avatar-next" aria-label="Next character page">›</button></nav><p id="avatar-choice" class="avatar-choice" aria-live="polite"></p></fieldset><button class="primary" id="join-submit">Continue</button></form><button id="recover" class="text-button" hidden>Recover my score on this device</button><p id="recovery-code" role="status"></p></section><section id="play-area" hidden><div class="live-heading"><p class="eyebrow" id="phase"></p><div id="round-timer" class="round-timer" role="timer" aria-live="off" hidden><span class="round-timer-value" aria-hidden="true"></span><span class="round-timer-label" aria-hidden="true">SECONDS LEFT</span><span class="round-timer-track" aria-hidden="true"><span class="round-timer-fill"></span></span></div><strong id="score"></strong></div><section id="stage" class="stage" aria-live="polite"></section></section></main><dialog id="avatar-preview" class="avatar-preview" aria-labelledby="avatar-preview-name"><img id="avatar-preview-image" alt=""><h2 id="avatar-preview-name"></h2><div class="avatar-preview-actions"><button type="button" id="avatar-preview-back">Back</button><button type="button" class="primary" id="avatar-preview-confirm">Confirm</button></div></dialog><dialog id="character-recovery" class="avatar-preview" aria-labelledby="character-recovery-heading"><form id="character-recovery-form"><h2 id="character-recovery-heading">Recover my score</h2><label>Your original character<select required id="recovery-avatar"></select></label><div class="avatar-preview-actions"><button type="button" id="cancel-character-recovery">Cancel</button><button class="primary" id="request-character-recovery">Get recovery code</button></div><p id="character-recovery-error" role="alert"></p></form></dialog><script src="/game-avatars.js"></script><script src="/game-client.js"></script><script src="/game-player.js"></script></body></html>
