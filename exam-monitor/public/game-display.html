<!doctype html><html lang="en"><head><script src="/session-lifecycle.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examio · Games</title><link rel="stylesheet" href="/examio.css"><link rel="stylesheet" href="/game.css"><link rel="stylesheet" href="/game-stage.css"><link rel="stylesheet" href="/game-classroom-lobby.css"><link rel="stylesheet" href="/game-avatar-motion.css"><link rel="stylesheet" href="/game-intro.css"></head><body class="game-display"><header><a class="brand" href="/"><img src="/landing/examio-mark.svg" alt="" width="40" height="40"><strong>Examio</strong><span>PLAY · LEARN · REPEAT</span></a><section id="join-details" class="game-room-entry" aria-label="Room entry" hidden><p>Go to <a href="/" id="join-link">Examio</a></p><strong id="room-name"></strong><p id="room-instructions">Enter this room name to join.</p></section>
<button id="join-qr-button" class="game-room-qr" type="button" aria-label="Enlarge join QR code" aria-haspopup="dialog" aria-controls="join-qr-dialog" hidden><img id="qr" alt="" width="128" height="128"><span>Click to enlarge</span></button></header><main><p id="status" role="status" aria-live="polite"></p><div class="live-heading"><div><p class="eyebrow" id="phase">Connecting…</p><h1 id="game-title">Live quiz</h1></div><div id="round-timer" class="round-timer" role="timer" aria-live="off" hidden><span class="round-timer-value" aria-hidden="true"></span><span class="round-timer-label" aria-hidden="true">SECONDS LEFT</span><span class="round-timer-track" aria-hidden="true"><span class="round-timer-fill"></span></span></div></div><section id="stage" class="stage" aria-live="polite"></section><div id="celebration" class="celebration" hidden><div class="celebration-beams" aria-hidden="true"><span></span><span></span><span></span></div><div class="celebration-card"><span class="celebration-label">New leader</span><img class="player-avatar" alt=""><strong class="celebration-name"></strong></div></div></main><footer id="game-audio-controls" class="game-audio-controls" hidden>
  <button type="button" id="classroom-advance" class="primary" hidden>Next Question</button>
  <div class="game-sound-control">
    <button type="button" id="sound-speaker" aria-label="Sound controls" title="Sound controls" aria-controls="sound-panel" aria-expanded="false">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-waves" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/><path class="sound-off" d="m16 10 5 5m0-5-5 5"/>
      </svg>
    </button>
    <div id="sound-panel" class="game-sound-panel" role="group" aria-label="Classroom sound" hidden>
      <label for="game-volume">Volume</label>
      <input id="game-volume" type="range" min="0" max="100" value="35">
      <button type="button" id="game-audio-toggle">Enable sound</button>
    </div>
  </div>
</footer>
<dialog id="join-qr-dialog" aria-labelledby="join-qr-title">
  <h2 id="join-qr-title">Scan to join the game</h2>
  <img id="join-qr-enlarged" alt="Game room join QR code" width="440" height="440">
  <button id="join-qr-close" type="button" autofocus>Close</button>
</dialog><script src="/game-avatars.js"></script><script src="/game-client.js"></script><script src="/game-show.js"></script><script src="/game-audio.js"></script><script src="/game-classroom-control.js"></script><script src="/game-lobby-controls.js"></script><script src="/game-display.js"></script></body></html>
