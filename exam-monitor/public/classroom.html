<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Examio · Classroom</title><link rel="stylesheet" href="classroom.css?v=class-header"><link rel="stylesheet" href="/examio.css">
<link rel="stylesheet" href="/pause.css?v=class-header"></head><body><header class="class-display-header"><div class="class-brand-group"><div class="brand examio-brand"><img class="brand-mark" src="/landing/examio-mark.svg" alt="" width="48" height="48"><span class="brand-type"><strong>Examio</strong><small>TEST <i>•</i> MONITOR <i>•</i> GRADE</small></span></div><button id="class-theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme"><span class="icon-sun" aria-hidden="true">☀</span><span class="icon-moon" aria-hidden="true">☾</span></button><label class="class-activity-switch"><input id="class-live-activity" type="checkbox" role="switch" checked><span class="class-switch-track" aria-hidden="true"></span><span>Show live activity</span></label></div><section id="class-room-banner" class="class-room-banner" aria-label="Room entry" hidden><p><span>Go to</span> <a href="/">www.examio.io</a></p><strong id="class-room-name"></strong><p>Enter this room name to join.</p></section><button id="qr-toggle" aria-label="Expand join QR code" aria-expanded="false" hidden><img id="qr" alt="Scan to join the classroom"><span>Click to enlarge</span></button></header><section class="class-session-info"><div><h1 id="title">Your classroom is opening.</h1><p id="phase">Move this window to your classroom screen.</p></div><p id="class-timer" hidden>Time remaining <strong id="class-time"></strong></p></section><section id="class-pause" class="examio-pause-banner" role="status" hidden><div class="examio-pause-card"><span class="examio-pause-symbol" aria-hidden="true">Ⅱ</span><h2>Test is Paused.</h2><p>Wait a moment.</p></div></section><main><p id="count"></p><div id="students" aria-live="polite"></div><p id="connection" role="status"></p></main><script src="/socket.io/socket.io.js"></script><script src="/ko.js?v=class-header"></script><script src="/language.js"></script><script src="classroom.js?v=class-header"></script></body></html>
